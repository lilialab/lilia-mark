<app-modal
  [open]="open()"
  [title]="'shortcuts.title' | transloco"
  [closeLabel]="'shortcuts.close' | transloco"
  panelClass="max-w-xl"
  (closed)="closed.emit()"
>
  <div class="space-y-4">
    @for (section of sections(); track section.title) {
      <section>
        <h3 class="mb-2 text-xs font-medium tracking-wide text-(--app-muted)">
          {{ section.title }}
        </h3>
        <ul class="divide-y divide-(--app-border) overflow-hidden rounded-md border border-(--app-border)">
          @for (hint of section.hints; track hint.keys) {
            <li class="flex items-start justify-between gap-4 bg-(--app-bg) px-3 py-2.5">
              <kbd
                class="shrink-0 rounded border border-(--app-border) bg-(--app-bg-raised) px-1.5 py-0.5 font-mono text-xs text-(--app-fg)"
              >
                {{ hint.keys }}
              </kbd>
              <span class="min-w-0 flex-1 text-right text-sm text-(--app-muted)">
                {{ hint.description }}
              </span>
            </li>
          }
        </ul>
      </section>
    }
  </div>
</app-modal>
